<div class="heroes-list-component">
  <h1>{{ tittle }}</h1>

  <ul>
    <li *ngFor="let hero of heroes">
      <ul> Index : {{ hero.index }}
        <li>
          <span class = "strong">Name</span> {{ hero.name }}
        </li>
        <li>
          <span class = "strong">Hobby</span> {{ hero.hobby }}
        </li>
      </ul>
    </li>
  </ul>
</div>
