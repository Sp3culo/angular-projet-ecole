<div class="admin">
  <table id="customers" *ngIf="users">
    <tr>
      <th>Username</th>
      <th>Score</th>
      <th>Admin</th>
      <th>Delete</th>
      <th>Change admin right</th>
    </tr>
    <tr *ngFor="let user of users">
      <td>{{ user?.username }}</td>
      <td>{{ user?.score }}</td>
      <td>{{ user?.admin }}</td>
      <td><button class="danger" (click)="handleDelete(user.id)">Delete user</button></td>
      <td><button (click)="handleAmin(user.id)">Remove / add admin right</button></td>
    </tr>
  </table>
</div>
