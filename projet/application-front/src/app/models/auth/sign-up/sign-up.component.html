<div class="sign-up">
  <div class="content">
    <h1>Je m'enregistre</h1>

    <form [formGroup]="reactiveSignUpForm" (ngSubmit)="handleSubmit()">
      <div>
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" formControlName="username">
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" formControlName="password">
      </div>

      <div>
        <label for="birthdate">Date de naissance</label>
        <input type="date" id="birthdate" formControlName="birthdate">
      </div>

      <div class="erro-card">
        <span class="error" *ngIf="reactiveSignUpForm.get('username')?.hasError('required')">
          Le champs <span class="underline">Nom d'utilisateur</span> est requis
        </span>

        <span class="error" *ngIf="reactiveSignUpForm.get('username')?.hasError('minLength')">
          Le champs <span class="underline">Nom d'utilisateur</span> doit comporter au moins 5 caractères
        </span>

        <span class="error" *ngIf="reactiveSignUpForm.get('password')?.hasError('required')">
          Le champs <span class="underline">Mot de passe</span> est requis
        </span>

        <span class="error" *ngIf="reactiveSignUpForm.get('password')?.hasError('minLength')">
          Le champs <span class="underline">Mot de passe</span> doit comporter au moins 6 caractères
        </span>

        <span class="error" *ngIf="reactiveSignUpForm.get('birthdate')?.hasError('required')">
          Le champs <span class="underline">Date de naissance</span> est requis
        </span>
      </div>

      <button *ngIf="!loader" class="validateForm" type="submit" [disabled]="!reactiveSignUpForm.valid">Valider</button>
<!--      <button *ngIf="loader" class="faIcon">LOAD <i class="fa-solid fa-spinner fa-spin-pulse"></i></button>-->
    </form>

  </div>
</div>
